worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Permite subir fotos grandes (evidencias, firmas)
    client_max_body_size 50M;

    server {
        listen 80;
        server_name _;

        # --- API de Django ---
        location /api/ {
            proxy_pass http://web:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Panel admin de Django ---
        location /admin/ {
            proxy_pass http://web:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Archivos subidos (fotos, firmas) — servidos directo del disco ---
        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # --- Archivos estáticos de Django (admin CSS, etc.) ---
        location /static/ {
            alias /app/static/;
            expires 7d;
        }

        # --- Frontend (React ya compilado) ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
            # SPA: cualquier ruta que no sea un archivo real → index.html
            try_files $uri $uri/ /index.html;
        }
    }
}
