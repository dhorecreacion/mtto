services:
  db:
    image: postgres:15-alpine
    restart: always
    # Eliminamos env_file de aquí y dejamos que Docker lo busque en la raíz automáticamente
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py createsu && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    # Cargamos el archivo .env explícitamente para Django
    env_file:
      - .env
    environment:
      - STT_URL=http://stt:9000
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    depends_on:
      db:
        condition: service_healthy

  # Servicio de transcripción de voz (Speech-to-Text)
  stt:
    build: ./stt
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=base
      - WHISPER_LANG=es

  # Motor de LLM local (llama3.2:1b) para estructurar el texto
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # IP de la máquina anfitriona en la red local (para acceso desde otros dispositivos)
      - VITE_API_URL=http://192.168.1.43:8000
    depends_on:
      - web

volumes:
  postgres_data:
  ollama_data: