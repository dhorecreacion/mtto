services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # Solo accesible desde el propio servidor (DBeaver/psql local), no desde la LAN
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    # En producción: migra, crea superusuario y recolecta estáticos. Sin runserver con --reload.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsu &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/static
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Reverse proxy — único punto de entrada (HTTP)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  static_data:
